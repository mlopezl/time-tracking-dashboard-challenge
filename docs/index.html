<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>time-tracking-dashboard</title>
    <script type="module" crossorigin src="/assets/index-2_Bft3GJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-qK_qXMG-.css">
  </head>
  <body class="bg-navy-950">
    <main class="container m-auto dashboard w-full min-h-screen bg-navy-950 p-4 flex flex-col items-center justify-center  gap-4 pt-10 font-rubik lg:flex-row lg:justify-center">
      <article class="user bg-navy-900 w-70 h-40 rounded-xl lg:w-50 lg:h-114">
        <header class="user__info bg-purple-600 w-full h-25 rounded-xl flex justify-center items-center gap-5 lg:h-80 lg:flex-col lg:items-start lg:p-5">
          <div class="user__picture w-14 h-14 rounded-full bg-white flex justify-center items-center">
            <img class="w-13 h-13" src="/assets/image-jeremy-CA1woC3-.png" alt="Profile user picture picture">
          </div>
          <div class="user__name flex flex-col">
            <p class="text-navy-200 text-xs">Report for</p>
            <h1 class="text-white font-light text-xl lg:text-3xl">Jeremy Robson</h1>
          </div>
        </header>
        <div class="timeframe__type flex p-4 gap-10 justify-center items-center text-purple-500 lg:flex-col lg:gap-2 lg:items-start lg:pl-5">
          <button id="daily" class="focus:text-white hover:text-white hover:transition hover:transition-all hover:duration-500 focus:outline-none font-light">Daily</button> 
          <button id="weekly" class="focus:text-white hover:text-white hover:transition hover:transition-all hover:duration-500 focus:outline-none font-light" autofocus>Weekly</button>
          <button id="monthly" class="focus:text-white hover:text-white transition duration-500 focus:outline-none font-light">Monthly</button>
        </div>
      </article>
      <section id="results" class="results flex flex-col justify-center gap-4 mb-20 sm:flex-row sm:justify-center sm:flex-wrap lg:w-150 lg:pt-20 xl:w-190">
        <article class="activity bg-${categoryTitle} w-70 h-35 rounded-xl relative overflow-hidden flex flex-col justify-end gap-5">
          <img class="w-15 absolute -top-1 right-3" src="./src/assets/images/icon-${categoryTitle}.svg" alt="work icon">
          <div class="activity__data absolute -bottom-1  w-full h-27 flex flex-col gap-2 p-4 rounded-xl bg-navy-900 z-2 hover:filter hover:brightness-180 transition transition-all duration-500">
            <div class="labels flex justify-between items-center text-white">
              <p class="capitalize">${categoryTitle}</p>
              <img class="w-5 h-1" src="data:image/svg+xml,%3csvg%20width='21'%20height='5'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M2.5%200a2.5%202.5%200%201%201%200%205%202.5%202.5%200%200%201%200-5Zm8%200a2.5%202.5%200%201%201%200%205%202.5%202.5%200%200%201%200-5Zm8%200a2.5%202.5%200%201%201%200%205%202.5%202.5%200%200%201%200-5Z'%20fill='%23BBC0FF'%20fill-rule='evenodd'/%3e%3c/svg%3e" alt="Ellipsis icon">
            </div>
            <div class="data flex justify-between items-center text-white">
              <p class="text-3xl font-extralight">${categoryWeekly.current}hrs</p>
              <p class="text-xs text-navy-200">Last Month - ${categoryWeekly.previous}hrs</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
