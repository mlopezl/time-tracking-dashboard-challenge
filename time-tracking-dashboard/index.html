<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>time-tracking-dashboard</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <main class="dashboard w-full min-h-screen bg-navy-950 p-4 flex flex-col items-center gap-4 pt-15 font-rubik">
      <article class="user bg-navy-900 w-70 h-40 rounded-xl">
        <header class="user__info bg-purple-600 w-full h-25 rounded-xl flex justify-center items-center gap-5">
          <div class="user__picture w-14 h-14 rounded-full bg-white flex justify-center items-center">
            <img class="w-13 h-13" src="./src/assets/images/image-jeremy.png" alt="Profile user picture picture">
          </div>
          <div class="user__name flex flex-col">
            <p class="text-navy-200 text-xs">Report for</p>
            <h1 class="text-navy-200 text-xl">Jeremy Robson</h1>
          </div>
        </header>
        <div class="timeframe__type flex p-4 gap-10 justify-center items-center text-purple-500">
          <button class="focus:text-white hover:text-white focus:outline-none font-light">Daily</button> 
          <button class="focus:text-white hover:text-white focus:outline-none font-light" autofocus>Weekly</button>
          <button class="focus:text-white hover:text-white focus:outline-none font-light">Monthly</button>
        </div>
      </article>
      <section class="results flex flex-col justify-center gap-4">
        <article class="activity bg-work w-70 h-35 rounded-xl relative overflow-hidden flex flex-col justify-end gap-5">
          <img class="w-15 absolute -top-2 right-3" src="./src/assets/images/icon-work.svg" alt="work icon">
          <div class="activity__data absolute -bottom-1  w-full h-27 flex flex-col gap-2 p-4 rounded-xl bg-navy-900 z-2 hover:bg-purple-500">
            <div class="labels flex justify-between items-center text-white">
              <p>Work</p>
              <img class="w-5 h-1" src="./src/assets/images/icon-ellipsis.svg" alt="Ellipsis icon">
            </div>
            <div class="data flex justify-between items-center text-white">
              <p class="text-3xl font-extralight">32hrs</p>
              <p class="text-xs text-navy-200">Last Week - <span>36hrs</span></p>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
